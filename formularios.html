        <form>
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
                <br>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Digite seu email" required>
                <br>

                <label for="filhos">Número de filhos</label>
                <input type="number" id="filhos" min="0" max="20">

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" min="1990-01-01" max="2009-12-31" required>
                <br>
                <p>Sexo</p>
                <br>
                <label for="sexo">Sexo</label>
                <input type="radio" id="sexo" value="M">
                <label for="sexo">Masculino</label>
                <input type="radio" id="sexo" value="F">
                <label for="sexo">Feminino</label>
                <br>

                <label for="estado">Estado</label>
                <select name="estado" id="estado">
                    <option value="0">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>                    
                </select>

            </fieldset>
            <fieldset>
                <legend>Área de interesse</legend>
                <label><input type="checkbox" name="html" value="HTML"> HTML</label>
                <label><input type="checkbox" name="css" value="CSS"> CSS</label>

            </fieldset>
            <fieldset>

                <label><input type="checkbox" name="aceito" id="aceito" checked>Li e aceito.</label>
                <br>
                <input type="range" min="0" max="10" step="0.2"><br>
                <input type="time"><br>
                <input type="color"><br>

                    <option value="op1">Opção 1</option>
                    <option value="op2">Opção 2</option>
                    <option value="op3">Opção 3</option>
                    <option value="op4">Opção 4</option>
                </select>
